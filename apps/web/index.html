<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1218" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="增长日记" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>增长日记</title>
    <script>
      try {
        var t = localStorage.getItem("stock-diary-theme");
        if (t) document.documentElement.dataset.theme = t;
        var p = localStorage.getItem("stock-diary-pwa-prefs");
        if (p) {
          var j = JSON.parse(p);
          if (j.iconPreset) {
            var themeColors = {
              inkgold: "#0f1218",
              festive: "#c41e3a",
              ocean: "#1677ff",
              forest: "#2d8a4e",
              dark: "#1a1f2e",
              minimal: "#ffffff",
              lavender: "#7c5cbf",
              tech: "#070b14",
            };
            if (themeColors[j.iconPreset]) {
              document
                .querySelector('meta[name="theme-color"]')
                .setAttribute("content", themeColors[j.iconPreset]);
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
