<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新建复盘 — 复盘日记</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .mood-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .mood-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 4px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
    }
    .mood-btn .emoji { font-size: 24px; line-height: 1; }
    .mood-btn .lab { font-size: 11px; color: var(--muted); font-weight: 500; }
    .mood-btn.on {
      border-color: var(--brand);
      background: var(--brand-soft);
      box-shadow: 0 0 0 3px rgba(13, 115, 119, 0.12);
    }
    .mood-btn.on .lab { color: var(--brand-deep); font-weight: 600; }

    .editor-hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px;
      line-height: 1.5;
    }
    .editor-bar button {
      width: auto;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 正文内股票代码自动标签 */
    .editor-body .stock-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      margin: 0 2px;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand-deep);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      vertical-align: baseline;
    }
    .editor-body .stock-inline .n {
      font-weight: 500;
      opacity: 0.85;
    }

    /* 自动识别摘要（只读，不选手动选择） */
    .auto-stocks {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--brand-soft);
      border-radius: 12px;
      font-size: 12px;
      color: var(--brand-deep);
      line-height: 1.6;
    }
    .auto-stocks strong { font-weight: 700; }
    .auto-stocks .stock {
      margin: 2px 4px 2px 0;
    }

    /* 大盘概况：自动读取指数 */
    .market-card {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }
    .market-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: none;
      background: var(--bg);
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .market-toggle .chev {
      font-size: 11px;
      color: var(--muted);
      transition: transform .2s;
      flex-shrink: 0;
      width: 12px;
    }
    .market-card:not(.collapsed) .chev { transform: rotate(90deg); }
    .market-toggle strong {
      font-size: 13px;
      color: var(--ink);
      flex-shrink: 0;
    }
    .market-toggle .hint {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }
    .market-toggle .summary {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .market-toggle .date {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .market-card.collapsed .market-body { display: none; }
    .market-card.collapsed .summary { display: block; }
    .market-card:not(.collapsed) .summary { display: none; }
    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
    }
    .market-item {
      background: var(--surface);
      padding: 12px 14px;
    }
    .market-item .name {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .market-item .point {
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      line-height: 1.2;
    }
    .market-item .chg {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .market-item .chg.up { color: var(--up); }
    .market-item .chg.down { color: var(--down); }
    .market-item .chg.flat { color: var(--muted); }

    .market-extra {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .breadth {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .breadth .lbl {
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      width: 16px;
    }
    .breadth .lbl.down { color: var(--down); }
    .breadth .lbl.up { color: var(--up); }
    .breadth .bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      background: var(--bg-deep);
    }
    .breadth .bar .seg-down { background: var(--down); }
    .breadth .bar .seg-up { background: var(--up); }
    .breadth .nums {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 72px;
      text-align: center;
    }
    .market-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .stat-box .k {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .stat-box .v {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-box .v.up { color: var(--up); }
    .stat-box .v.down { color: var(--down); }
  </style>
</head>
<body class="mobile-live">
  <div class="proto-banner">收盘前写当天笔记 → 盘中快照 · 可加 <code>?demo=intraday</code> 预览 · <a href="index.html">导航</a></div>

  <div class="device-stage">
    <div class="phone">
      <div class="phone-notch">
        <div class="status-bar"><span>16:36</span><span class="icons">■■■ ▓</span></div>
      </div>

      <div class="app">
        <header class="app-header">
          <a href="mobile-diary-list.html" class="header-btn" aria-label="返回">←</a>
          <div class="title">新建复盘</div>
          <div style="width:40px"></div>
        </header>

        <div class="app-scroll">
          <div class="edit-pad">
            <div class="field">
              <input class="input title-field" type="text" value="" placeholder="输入标题（自动加粗）">
            </div>

            <div class="field">
              <label>复盘日期</label>
              <input class="input" type="date" id="entryDate" value="2026-07-23">
            </div>

            <div class="field">
              <div class="market-card collapsed" id="marketCard">
                <button type="button" class="market-toggle" id="marketToggle" aria-expanded="false">
                  <span class="chev">▶</span>
                  <strong>大盘概况</strong>
                  <span class="hint">自动</span>
                  <span class="summary" id="marketSummary">加载中…</span>
                  <span class="date" id="marketDateLabel">2026-07-23</span>
                </button>
                <div class="market-body">
                  <div class="market-grid" id="marketGrid"></div>
                  <div class="market-extra" id="marketExtra"></div>
                </div>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label>当日盈亏（元）</label>
                <input class="input" type="number" value="1200" placeholder="可正可负">
              </div>
              <div class="field">
                <label>总盈亏（元）</label>
                <input class="input" type="number" value="8600" placeholder="账户累计">
              </div>
            </div>

            <div class="field">
              <label>情绪 <span style="font-weight:400;color:var(--muted)">（点选表情）</span></label>
              <div class="mood-row" id="mood">
                <button type="button" class="mood-btn on" data-mood="calm">
                  <span class="emoji">😌</span><span class="lab">冷静</span>
                </button>
                <button type="button" class="mood-btn" data-mood="anxious">
                  <span class="emoji">😰</span><span class="lab">焦虑</span>
                </button>
                <button type="button" class="mood-btn" data-mood="greedy">
                  <span class="emoji">🤑</span><span class="lab">贪婪</span>
                </button>
                <button type="button" class="mood-btn" data-mood="fearful">
                  <span class="emoji">😨</span><span class="lab">恐惧</span>
                </button>
                <button type="button" class="mood-btn" data-mood="other">
                  <span class="emoji">😐</span><span class="lab">其他</span>
                </button>
              </div>
            </div>

            <div class="section-label">正文</div>
            <p class="editor-hint">先点正文某处，再点「插图」插到该位置。没有固定插图位。</p>
            <div class="editor">
              <div class="editor-bar">
                <button type="button" class="on" title="加粗选中文字"><b>B</b></button>
                <button type="button" title="斜体"><i>I</i></button>
                <button type="button" id="btnList" title="在正文插入列表">≡ 列表</button>
                <button type="button" id="btnImg" title="在正文插入图片">🖼 插图</button>
              </div>
              <div class="editor-body" id="editor" contenteditable="true">
                <p><strong>操作回顾</strong>：</p>
                <ul>
                  <li><span class="stock-inline" contenteditable="false" data-code="600519">600519<span class="n">贵州茅台</span></span> 突破前高后加仓 100 股，成本 1680</li>
                  <li><span class="stock-inline" contenteditable="false" data-code="688981">688981<span class="n">中芯国际</span></span> 早盘低吸，尾盘浮盈 3.2%</li>
                </ul>
                <p><strong>反思</strong>：追涨时仓位控制较好，但 <span class="stock-inline" contenteditable="false" data-code="688981">688981<span class="n">中芯国际</span></span> 入场偏早，应等确认后再进。</p>
              </div>
            </div>
            <div class="auto-stocks" id="autoStocks">
              <strong>自动识别（用于按代码查询）</strong><br>
              <span class="stock">600519 贵州茅台</span>
              <span class="stock">688981 中芯国际</span>
            </div>
          </div>
        </div>

        <div class="sticky-save">
          <button class="btn btn-primary btn-block" type="button" onclick="location.href='mobile-diary-list.html'">保存复盘</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const CATALOG = {
      '600519': '贵州茅台',
      '688981': '中芯国际',
      '000001': '平安银行',
      '300750': '宁德时代',
      '600809': '山西汾酒',
      '000568': '泸州老窖'
    };

    document.querySelectorAll('#mood .mood-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#mood .mood-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
      };
    });

    // 大盘概况：盘中快照 vs 收盘（原型模拟）
    const MOCK_CLOSE = {
      '2026-07-23': [
        { id: 'sh000001', name: '上证指数', point: 3456.78, change: 0.80, changeAmt: 27.45 },
        { id: 'sz399001', name: '深证成指', point: 11234.56, change: 1.12, changeAmt: 124.30 },
        { id: 'sz399006', name: '创业板指', point: 2345.67, change: -0.35, changeAmt: -8.21 },
        { id: 'sh000688', name: '科创50', point: 987.65, change: 0.52, changeAmt: 5.10 }
      ],
      '2026-07-22': [
        { id: 'sh000001', name: '上证指数', point: 3429.33, change: -0.42, changeAmt: -14.50 },
        { id: 'sz399001', name: '深证成指', point: 11110.26, change: -0.28, changeAmt: -31.20 },
        { id: 'sz399006', name: '创业板指', point: 2353.88, change: 0.15, changeAmt: 3.52 },
        { id: 'sh000688', name: '科创50', point: 982.55, change: -0.88, changeAmt: -8.72 }
      ]
    };
    // 盘中：点位略低于收盘演示值
    const MOCK_INTRADAY = {
      '2026-07-23': [
        { id: 'sh000001', name: '上证指数', point: 3448.12, change: 0.55, changeAmt: 18.79 },
        { id: 'sz399001', name: '深证成指', point: 11208.40, change: 0.89, changeAmt: 98.14 },
        { id: 'sz399006', name: '创业板指', point: 2341.20, change: -0.54, changeAmt: -12.68 },
        { id: 'sh000688', name: '科创50', point: 984.30, change: 0.31, changeAmt: 3.05 }
      ]
    };

    const MOCK_STATS_CLOSE = {
      '2026-07-23': { rise: 2489, fall: 2780, turnover: 22094, capitalInflow: -233.01 },
      '2026-07-22': { rise: 986, fall: 4120, turnover: 18502, capitalInflow: -458.60 }
    };
    const MOCK_STATS_INTRADAY = {
      '2026-07-23': { rise: 2105, fall: 3012, turnover: 16880, capitalInflow: -189.45 }
    };

    const entryDate = document.getElementById('entryDate');
    const marketGrid = document.getElementById('marketGrid');
    const marketExtra = document.getElementById('marketExtra');
    const marketDateLabel = document.getElementById('marketDateLabel');

    const marketCard = document.getElementById('marketCard');
    const marketToggle = document.getElementById('marketToggle');
    const marketSummary = document.getElementById('marketSummary');

    marketToggle.addEventListener('click', () => {
      const collapsed = marketCard.classList.toggle('collapsed');
      marketToggle.setAttribute('aria-expanded', String(!collapsed));
    });

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    /** A 股 15:00 收盘前视为盘中 */
    function isBeforeMarketClose() {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      return mins < 15 * 60;
    }

    const forceIntradayDemo = new URLSearchParams(location.search).get('demo') === 'intraday';

    function isIntradaySnapshot(dateStr) {
      if (forceIntradayDemo && dateStr === '2026-07-23') return true;
      return dateStr === todayStr() && isBeforeMarketClose();
    }

    function renderMarket(dateStr) {
      const intraday = isIntradaySnapshot(dateStr);
      const data = intraday
        ? (MOCK_INTRADAY[dateStr] || MOCK_CLOSE[dateStr] || MOCK_CLOSE['2026-07-23'])
        : (MOCK_CLOSE[dateStr] || MOCK_CLOSE['2026-07-23']);
      const stats = intraday
        ? (MOCK_STATS_INTRADAY[dateStr] || MOCK_STATS_CLOSE[dateStr] || MOCK_STATS_CLOSE['2026-07-23'])
        : (MOCK_STATS_CLOSE[dateStr] || MOCK_STATS_CLOSE['2026-07-23']);

      marketDateLabel.textContent = intraday
        ? `${dateStr} 盘中`
        : `${dateStr} 收盘`;

      const sh = data[0];
      const flowSign = stats.capitalInflow >= 0 ? '+' : '';
      marketSummary.textContent =
        `上证${sh.change >= 0 ? '+' : ''}${sh.change.toFixed(2)}% · ${stats.fall}跌:${stats.rise}涨 · 资金${flowSign}${stats.capitalInflow.toFixed(0)}亿`;

      marketGrid.innerHTML = data.map(idx => {
        const dir = idx.change > 0 ? 'up' : idx.change < 0 ? 'down' : 'flat';
        const sign = idx.change > 0 ? '+' : '';
        const arrow = idx.change > 0 ? '▲' : idx.change < 0 ? '▼' : '—';
        return `<div class="market-item">
          <div class="name">${idx.name}</div>
          <div class="point">${idx.point.toLocaleString('zh-CN', { minimumFractionDigits: 2 })}</div>
          <div class="chg ${dir}">${arrow} ${sign}${idx.changeAmt.toFixed(2)} (${sign}${idx.change.toFixed(2)}%)</div>
        </div>`;
      }).join('');

      const total = stats.rise + stats.fall;
      const fallPct = total ? (stats.fall / total * 100).toFixed(1) : 50;
      const risePct = total ? (100 - fallPct).toFixed(1) : 50;
      const flowSign = stats.capitalInflow >= 0 ? '+' : '';
      const flowCls = stats.capitalInflow >= 0 ? 'up' : 'down';

      marketExtra.innerHTML = `
        <div class="breadth">
          <span class="lbl down">跌</span>
          <div class="bar">
            <div class="seg-down" style="width:${fallPct}%"></div>
            <div class="seg-up" style="width:${risePct}%"></div>
          </div>
          <span class="lbl up">涨</span>
        </div>
        <div class="nums" style="margin:-4px 0 10px;text-align:center">${stats.fall.toLocaleString()} : ${stats.rise.toLocaleString()}</div>
        <div class="market-stats">
          <div class="stat-box">
            <div class="k">成交额</div>
            <div class="v">${stats.turnover.toLocaleString()} 亿</div>
          </div>
          <div class="stat-box">
            <div class="k">大盘资金净流入</div>
            <div class="v ${flowCls}">${flowSign}${stats.capitalInflow.toFixed(2)} 亿</div>
          </div>
        </div>`;
    }

    entryDate.addEventListener('change', () => renderMarket(entryDate.value));
    renderMarket(entryDate.value);

    const editor = document.getElementById('editor');
    const autoStocks = document.getElementById('autoStocks');
    let savedRange = null;
    let tagifyTimer = null;

    function saveSelection() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        savedRange = range.cloneRange();
      }
    }

    function refreshAutoSummary() {
      const codes = [...editor.querySelectorAll('.stock-inline')]
        .map(el => el.dataset.code)
        .filter(Boolean);
      const unique = [...new Set(codes)];
      if (!unique.length) {
        autoStocks.innerHTML = '<strong>自动识别</strong><br><span style="opacity:.7">正文中输入股票代码后会自动出现在这里</span>';
        return;
      }
      autoStocks.innerHTML =
        '<strong>自动识别（用于按代码查询）</strong><br>' +
        unique.map(c => `<span class="stock">${c} ${CATALOG[c] || ''}</span>`).join('');
    }

    function placeCaretAfter(node) {
      const sel = window.getSelection();
      const r = document.createRange();
      r.setStartAfter(node);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      savedRange = r.cloneRange();
    }

    /** 将正文中匹配代码库的纯文本代码替换为行内标签 */
    function tagifyCodes() {
      const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          if (node.parentElement?.closest('.stock-inline, .mock-img')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const targets = [];
      while (walker.nextNode()) targets.push(walker.currentNode);

      let changed = false;
      for (const textNode of targets) {
        const text = textNode.nodeValue;
        // A股 6 位代码；匹配代码库才标签化
        const re = /\b(\d{6})\b/g;
        let match;
        const parts = [];
        let last = 0;
        let hit = false;
        while ((match = re.exec(text)) !== null) {
          const code = match[1];
          if (!CATALOG[code]) continue;
          hit = true;
          if (match.index > last) parts.push(document.createTextNode(text.slice(last, match.index)));
          const span = document.createElement('span');
          span.className = 'stock-inline';
          span.contentEditable = 'false';
          span.dataset.code = code;
          span.innerHTML = `${code}<span class="n">${CATALOG[code]}</span>`;
          parts.push(span);
          last = match.index + code.length;
        }
        if (!hit) continue;
        if (last < text.length) parts.push(document.createTextNode(text.slice(last)));
        const parent = textNode.parentNode;
        const frag = document.createDocumentFragment();
        parts.forEach(p => frag.appendChild(p));
        const lastPart = parts[parts.length - 1];
        parent.replaceChild(frag, textNode);
        if (lastPart) placeCaretAfter(lastPart);
        changed = true;
        break; // 一次处理一处，避免选区错乱；下次 input 继续
      }
      if (changed) refreshAutoSummary();
    }

    editor.addEventListener('input', () => {
      saveSelection();
      clearTimeout(tagifyTimer);
      tagifyTimer = setTimeout(tagifyCodes, 280);
    });
    editor.addEventListener('keyup', saveSelection);
    editor.addEventListener('mouseup', saveSelection);
    editor.addEventListener('touchend', saveSelection);

    // 双击已标签代码可还原为纯文本（方便改错）
    editor.addEventListener('dblclick', (e) => {
      const tag = e.target.closest('.stock-inline');
      if (!tag) return;
      const text = document.createTextNode(tag.dataset.code);
      tag.replaceWith(text);
      placeCaretAfter(text);
      refreshAutoSummary();
    });

    function insertAtCaret(node) {
      editor.focus();
      const sel = window.getSelection();
      sel.removeAllRanges();
      if (savedRange) sel.addRange(savedRange);
      else {
        const r = document.createRange();
        r.selectNodeContents(editor);
        r.collapse(false);
        sel.addRange(r);
      }
      const range = sel.getRangeAt(0);
      range.deleteContents();
      range.insertNode(node);
      const after = document.createElement('p');
      after.innerHTML = '<br>';
      node.after(after);
      const r = document.createRange();
      r.setStart(after, 0);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      savedRange = r.cloneRange();
    }

    document.getElementById('btnList').addEventListener('mousedown', (e) => e.preventDefault());
    document.getElementById('btnImg').addEventListener('mousedown', (e) => e.preventDefault());
    document.getElementById('btnList').onclick = () => {
      editor.focus();
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
      document.execCommand('insertUnorderedList');
      saveSelection();
    };
    document.getElementById('btnImg').onclick = () => {
      const block = document.createElement('div');
      block.className = 'mock-img';
      block.contentEditable = 'false';
      block.textContent = '📊 插在光标处的图片';
      insertAtCaret(block);
    };

    refreshAutoSummary();
  </script>
</body>
</html>
