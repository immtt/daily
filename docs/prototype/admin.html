<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>用户审核 — 复盘日记</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mobile-live">
  <div class="proto-banner">管理员审核 · <a href="index.html">导航</a> · <a href="mobile-diary-list.html">日记</a></div>

  <div class="device-stage">
    <div class="phone">
      <div class="phone-notch">
        <div class="status-bar"><span>16:36</span><span class="icons">■■■ ▓</span></div>
      </div>

      <div class="app">
        <header class="app-header">
          <a href="mobile-diary-list.html" class="header-btn">←</a>
          <div class="title">用户审核</div>
          <a href="login.html" class="btn btn-ghost btn-sm" style="font-size:13px">退出</a>
        </header>

        <div class="app-scroll">
          <div class="seg" id="seg">
            <button type="button" class="on">待审核 2</button>
            <button type="button">已通过</button>
            <button type="button">已拒绝</button>
          </div>

          <div class="user-card">
            <div class="avatar">张</div>
            <div class="user-info">
              <div class="name">zhangsan</div>
              <div class="sub">注册于 2026-07-23 10:15</div>
              <span class="badge badge-pending" style="margin-top:6px">待审核</span>
            </div>
            <div class="user-actions">
              <button class="btn btn-primary btn-sm" type="button" onclick="alert('已通过 zhangsan')">通过</button>
              <button class="btn btn-danger btn-sm" type="button" onclick="alert('已拒绝 zhangsan')">拒绝</button>
            </div>
          </div>

          <div class="user-card">
            <div class="avatar">李</div>
            <div class="user-info">
              <div class="name">lisi</div>
              <div class="sub">注册于 2026-07-22 18:40</div>
              <span class="badge badge-pending" style="margin-top:6px">待审核</span>
            </div>
            <div class="user-actions">
              <button class="btn btn-primary btn-sm" type="button">通过</button>
              <button class="btn btn-danger btn-sm" type="button">拒绝</button>
            </div>
          </div>

          <div style="margin:20px 16px;padding:16px;background:var(--brand-soft);border-radius:14px;font-size:13px;color:var(--brand-deep);line-height:1.7">
            <strong>管理员说明</strong><br>
            · 与普通用户<strong>同一登录页</strong>，用 <code>admin</code> 登录<br>
            · 登录后底部 Tab 多一项「管理」（仅 admin 可见）<br>
            · 右上角「退出」清除登录态，回到登录页<br>
            · 默认密码 <code>ChangeMe_Admin_2026</code>，部署后请修改
          </div>
        </div>

        <nav class="tab-bar">
          <a class="tab-item" href="mobile-diary-list.html"><span class="ico">📓</span>日记</a>
          <a class="tab-item" href="diary-edit.html"><span class="ico">✏️</span>写复盘</a>
          <a class="tab-item active" href="admin.html"><span class="ico">👤</span>管理</a>
        </nav>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('#seg button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#seg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
      };
    });
  </script>
</body>
</html>
